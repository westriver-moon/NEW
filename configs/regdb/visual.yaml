experiment:
  variant: visual
  seed: 0
dataset:
  name: regdb
  root: null
  sr_root: ${FAVTA_SR_ROOT}
  caption_index: null
  regdb_trial: 1
  regdb_direction: visible_to_thermal
model:
  image_size: [512, 256]
  tokenizer:
    branches:
      - patch_size: [16, 16]
        stride: [12, 12]
      - patch_size: [16, 8]
        stride: [12, 6]
visual_enhancement:
  enabled: true
  modalities: [rgb, ir]
loss:
  favta_enabled: false
train:
  lr_text: 1.0e-5
evaluation:
  protocol: regdb
  gallery_trials: 1

