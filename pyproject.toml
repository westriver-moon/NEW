[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "favta"
version = "0.1.0"
description = "Four-view bidirectional hard-triplet alignment for visible-infrared person re-identification"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.19",
  "Pillow>=8",
  "PyYAML>=5.4",
  "torch>=1.8",
  "torchvision>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["favta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

