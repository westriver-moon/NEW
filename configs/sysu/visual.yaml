experiment:
  variant: visual
  seed: 0
dataset:
  name: sysu
  root: null
  sr_root: ${FAVTA_SR_ROOT}
  caption_index: null
model:
  image_size: [512, 256]
  tokenizer:
    branches:
      - patch_size: [16, 16]
        stride: [12, 12]
      - patch_size: [16, 8]
        stride: [12, 6]
visual_enhancement:
  enabled: true
  modalities: [rgb, ir]
loss:
  favta_enabled: false
  favta_weight: 1.0
train:
  lr_text: 1.0e-5
evaluation:
  protocol: all
  gallery_trials: 10

