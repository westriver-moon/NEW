[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "favta"
version = "0.1.0"
description = "Four-view bidirectional hard-triplet alignment for visible-infrared person re-identification"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.19",
  "Pillow>=8",
  "PyYAML>=5.4",
  "torch>=1.8",
  "torchvision>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]
qwen-caption = [
  "transformers==4.53.3",
  "accelerate==1.8.1",
  "datasets==3.6.0",
  "huggingface-hub==0.33.2",
  "safetensors==0.5.3",
  "zstandard==0.25.0",
]

[project.scripts]
favta-qwen-caption-augment = "favta.plugins.qwen_caption.generate:main"
favta-qwen-caption-merge = "favta.plugins.qwen_caption.merge:main"

[project.entry-points."favta.caption_augmentation"]
qwen_paraphrases = "favta.plugins.qwen_caption:QwenParaphrasePlugin"

[tool.setuptools.packages.find]
include = ["favta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
